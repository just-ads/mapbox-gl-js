    var map = window.map = new mapboxgl.Map({
        container: 'map',
        devtools: true,
        zoom: 15,
        center: [106.258, 27.256],
        style: 'mapbox://styles/mapbox/light-v9',
        projection: 'globe',
        hash: false
    });

    class CustomLayer {
        constructor(options) {
            this.id = options.id;
            this.type = 'custom';
            // this.renderingMode = '3d';
            this.coordinates = [
                [106.25612356985, 27.25612356985],
                [106.25856851215, 27.25612356985],
                [106.25856851215, 27.25465547252],
                [106.25612356985, 27.25465547252]
            ];
        }

        createProgram(gl) {
            const vs = `
attribute vec3 a_pos;
attribute vec2 a_tex;
uniform mat4 u_matrix;
varying vec2 v_tex;
void main() {
  gl_Position = u_matrix * vec4(a_pos, 1.0);
  v_tex = a_tex;
}
`;
            const fs = `
precision mediump float;
varying vec2 v_tex;
uniform sampler2D u_sampler;
void main() {
  gl_FragColor = texture2D(u_sampler, v_tex);
}
`;
            const vShader = gl.createShader(gl.VERTEX_SHADER);
            gl.shaderSource(vShader, vs);
            gl.compileShader(vShader);

            const fShader = gl.createShader(gl.FRAGMENT_SHADER);
            gl.shaderSource(fShader, fs);
            gl.compileShader(fShader);

            const program = gl.createProgram();
            gl.attachShader(program, vShader);
            gl.attachShader(program, fShader);
            gl.linkProgram(program);
            return program;
        }

        onAdd(map, gl) {
            this.map = map;
            this.gl = gl;

            this.texture = gl.createTexture();
            this.image = new Image();
            this.image.crossOrigin = "anonymous";

            this.image.onload = () => {
                gl.bindTexture(gl.TEXTURE_2D, this.texture);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
                gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, this.image);
            };
            this.image.src = './compass.png';

            this.program = this.createProgram(gl);
            this.uMatrix = gl.getUniformLocation(this.program, "u_matrix");

            const verts = [];
            this.coordinates.forEach(c => {
                const mc = mapboxgl.MercatorCoordinate.fromLngLat({lng: c[0], lat: c[1]}, 0);
                verts.push(mc.x, mc.y, mc.z || 0);
            });

            this.vertexBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, this.vertexBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(verts), gl.STATIC_DRAW);

            this.texBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, this.texBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
                0, 0,
                1, 0,
                1, 1,
                0, 1
            ]), gl.STATIC_DRAW);
        }

        updateVerticesWithTerrain() {
            const verts = [];

            for (const c of this.coordinates) {
                const elevation = this.map.queryTerrainElevation(
                    {lng: c[0], lat: c[1]},
                    {exaggerated: false}
                ) || 0;

                const mc = mapboxgl.MercatorCoordinate.fromLngLat(
                    {lng: c[0], lat: c[1]},
                    elevation
                );
                verts.push(mc.x, mc.y, mc.z);
            }

            this.gl.bindBuffer(this.gl.ARRAY_BUFFER, this.vertexBuffer);
            this.gl.bufferData(this.gl.ARRAY_BUFFER, new Float32Array(verts), this.gl.DYNAMIC_DRAW);
        }

        render(gl, matrix) {
            // this.updateVerticesWithTerrain();
            gl.useProgram(this.program);

            gl.uniformMatrix4fv(this.uMatrix, false, matrix);

            const aPos = gl.getAttribLocation(this.program, "a_pos");
            gl.bindBuffer(gl.ARRAY_BUFFER, this.vertexBuffer);
            gl.enableVertexAttribArray(aPos);
            gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 0, 0);

            const aTex = gl.getAttribLocation(this.program, "a_tex");
            gl.bindBuffer(gl.ARRAY_BUFFER, this.texBuffer);
            gl.enableVertexAttribArray(aTex);
            gl.vertexAttribPointer(aTex, 2, gl.FLOAT, false, 0, 0);

            gl.activeTexture(gl.TEXTURE0);
            gl.bindTexture(gl.TEXTURE_2D, this.texture);

            gl.drawArrays(gl.TRIANGLE_FAN, 0, 4);
        }
    }

    map.on('style.load', () => {
        map.addSource('mapbox-dem', {
            "type": "raster-dem",
            "url": "mapbox://mapbox.mapbox-terrain-dem-v1",
            "tileSize": 514,
            "maxzoom": 14
        });
        map.setTerrain({"source": "mapbox-dem"});
        map.addLayer(
            new CustomLayer({
                id: 'test'
            })
        );
    });

</script>
